<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17142b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fusión de Héroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: una sola pantalla tipo consola; arena en canvas arriba, tienda deslizable y acciones abajo */
:root{
  --night:#17142b; --panel:#251f42; --panel2:#2f2852; --line:#3d3566;
  --gold:#ffc83d; --gold-dk:#c98a00; --berry:#ff4f8b; --mint:#3fd68a; --sky:#5ec8ff;
  --ink:#fdf8ee; --muted:#aaa3cc;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  background-image:radial-gradient(circle at 20% 0%,#2a2350 0,transparent 45%),radial-gradient(circle at 90% 100%,#3a1f45 0,transparent 40%);}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:7px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box}
.hud{display:flex;align-items:center;gap:6px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px 9px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--ink);font-family:var(--f-body)}
button.chip{cursor:pointer}
.chip b{font-family:var(--f-display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.chip.lvl b{color:var(--sky)} .chip.coin b{color:var(--gold)} .chip.pow b{color:var(--mint)}
.coinIco{width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 var(--gold-dk);flex:none}
.hud .sp{flex:1}
.iconbtn{background:var(--panel);border:2px solid var(--line);color:var(--ink);border-radius:12px;width:38px;height:34px;font-size:16px;cursor:pointer;font-weight:900;flex:none}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas#cv{display:block;border-radius:14px;touch-action:none;box-shadow:0 6px 0 #0d0b1a,0 0 0 3px var(--line)}
.shop{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.shop::-webkit-scrollbar{display:none}
.buy{flex:0 0 70px;background:var(--panel);border:2px solid var(--line);border-bottom-width:5px;color:var(--ink);border-radius:12px;padding:3px 2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--f-body);min-width:0}
.buy canvas{width:38px;height:42px}
.buy .nm{font-size:11px;font-weight:800;line-height:1.1;text-align:center;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.buy .pr{font-family:var(--f-display);font-size:15px;color:var(--gold);display:flex;align-items:center;gap:3px}
.buy .pr .coinIco{width:11px;height:11px}
.buy:active:not(:disabled){transform:translateY(2px);border-bottom-width:3px}
.buy:disabled{opacity:.55;cursor:default}
.buy.locked .pr{color:var(--muted);font-family:var(--f-body);font-size:9px;font-weight:800;text-align:center;line-height:1.1}
.actions{display:grid;grid-template-columns:1fr 2fr 1fr 1fr;gap:6px}
.btn{font-family:var(--f-display);font-size:16px;border-radius:14px;border:0;padding:10px 4px;cursor:pointer;color:var(--ink);background:var(--panel2);box-shadow:0 4px 0 #15112a;letter-spacing:.3px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #15112a}
.btn.fight{background:var(--gold);color:#3a2300;font-size:22px;box-shadow:0 5px 0 var(--gold-dk)}
.btn.fight:active{box-shadow:0 2px 0 var(--gold-dk)}
.btn.sell.on{background:var(--berry)}
.btn:disabled{opacity:.5}
.btn.small{font-size:14px;padding:8px 12px}
.btn:focus-visible,.buy:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,.card:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,22,.55);border-radius:14px}
.bcard{background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:20px 24px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:82%}
.bcard h2{font-family:var(--f-display);font-weight:400;font-size:40px;margin:0;line-height:1}
.bcard.win h2{color:var(--gold)} .bcard.lose h2{color:var(--sky)}
.bcard p{margin:0;font-weight:800;color:var(--muted)}
.bcard .rw{font-family:var(--f-display);font-size:22px;color:var(--gold);display:flex;gap:6px;align-items:center}
#toasts{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:50;padding-inline:16px}
.toast{background:var(--panel2);border:2px solid var(--gold);border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px;max-width:460px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:tin .3s ease-out}
.toast.info{border-color:var(--sky)} .toast.warn{border-color:var(--berry)}
.toast strong{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--gold);display:block}
@keyframes tin{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;background:rgba(10,8,22,.8);z-index:40;display:flex;justify-content:center;align-items:flex-start;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.mpanel{background:var(--panel);border:3px solid var(--line);border-radius:20px;width:100%;max-width:540px;max-height:100%;display:flex;flex-direction:column;box-sizing:border-box}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:2px solid var(--line)}
.mhead h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;color:var(--gold)}
.mbody{overflow-y:auto;padding:12px 16px 18px;display:flex;flex-direction:column;gap:16px}
.intro{margin:0;color:var(--muted);font-weight:700;font-size:13px}
.fam h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fam h3 .ed{font-family:var(--f-body);font-size:11px;font-weight:800;background:var(--panel2);border:0;color:var(--sky);border-radius:8px;padding:3px 8px;cursor:pointer}
.fam .fd{font-size:13px;color:var(--muted);font-weight:700;margin:2px 0 8px}
.fam .lk{color:var(--berry)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{background:var(--panel2);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;border:2px solid transparent;color:var(--ink);font-family:var(--f-body)}
button.card{cursor:pointer}
.card canvas{width:100%;max-width:70px;aspect-ratio:64/72;height:auto}
.card .cn{font-size:11px;font-weight:900;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.card .ch{font-size:10px;font-weight:700;color:var(--muted);text-align:center;line-height:1.1}
.card .rk{font-family:var(--f-display);font-size:12px}
.editor{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--panel2);border-radius:12px;padding:8px;margin-top:8px}
.editor label{font-size:12px;font-weight:800;color:var(--muted);width:100%}
.editor input{flex:1;min-width:120px;font:800 15px var(--f-body);padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--night);color:var(--ink)}
.ach{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:8px 10px;border:2px solid transparent}
.ach.got{border-color:var(--gold)}
.ach .md{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:18px;background:var(--line);color:var(--muted)}
.ach.got .md{background:var(--gold);color:#3a2300}
.ach .tx{flex:1;min-width:0}
.ach .an{font-weight:900;font-size:14px}
.ach .ad{font-size:12px;color:var(--muted);font-weight:700}
.ach .ar{font-size:11px;font-weight:900;color:var(--mint)}
.world{background:var(--panel2);border-radius:14px;padding:10px 12px;border:2px solid transparent;display:flex;flex-direction:column;gap:6px}
.world.cur{border-color:var(--sky)} .world.done{border-color:var(--mint)}
.world .wt{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.world h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0}
.world .ws{font-size:12px;font-weight:900;color:var(--muted)}
.world.cur .ws{color:var(--sky)} .world.done .ws{color:var(--mint)}
.world .wr{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.world .wr canvas{width:44px;height:50px;background:rgba(0,0,0,.18);border-radius:8px}
.world .wr canvas.bossc{width:62px;height:62px}
.world .wd{font-size:12px;font-weight:700;color:var(--muted)}
.reset{align-self:center;background:transparent;border:2px solid var(--line);color:var(--muted);border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer;font-family:var(--f-body)}
.reset.arm{border-color:var(--berry);color:var(--berry)}
.buy.boxbtn{background:linear-gradient(180deg,#5a2fa0,#3a1f70);border-color:#8a5fe0}
.buy.boxbtn .nm{color:#fff}
.buy.boxbtn .pr{color:#ffe14d;font-size:12px;font-family:var(--f-body);font-weight:900}
.box{display:flex;gap:12px;align-items:center;background:var(--panel2);border-radius:14px;padding:10px 12px}
.box canvas{width:64px;height:64px;flex:none}
.box .bx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.box h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0}
.box .bd{font-size:12px;color:var(--muted);font-weight:700}
.box .bb{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.btn.buyb{background:var(--gold);color:#3a2300;box-shadow:0 4px 0 var(--gold-dk);display:inline-flex;align-items:center;gap:5px}
.btn.buyb .coinIco{box-shadow:inset -2px -2px 0 var(--gold-dk),0 0 0 1.5px #3a2300}
.btn.freeb{background:var(--mint);color:#06301a;box-shadow:0 4px 0 #1f9a5c}
#boxView{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 45%,#3a2a6a,#0d0a1c 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px}
#bcv{width:min(86vw,46vh,360px);height:min(86vw,46vh,360px);cursor:pointer}
#bvTitle{font-family:var(--f-display);font-size:22px;color:var(--muted);text-align:center;min-height:28px}
#bvName{font-family:var(--f-display);font-size:32px;text-align:center;min-height:40px;line-height:1.1}
.newtag{display:inline-block;background:var(--berry);color:#fff;font-size:14px;border-radius:8px;padding:2px 8px;vertical-align:middle;margin-left:6px}
@media (max-width:380px){.btn{font-size:14px}.btn.fight{font-size:19px}.chip{padding:3px 6px}.chip b{font-size:16px}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>


<div id="app">
  <header class="hud">
    <button class="chip lvl" id="btnWorld" aria-label="Ver mundos">Mundo <b id="hLevel">1-1</b></button>
    <div class="chip coin"><span class="coinIco"></span><b id="hCoins">0</b></div>
    <div class="chip pow">Poder <b id="hPow">+0%</b></div>
    <span class="sp"></span>
    <button id="btnSound" class="iconbtn" aria-label="Sonido encendido">♪</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" width="500" height="660" aria-label="Campo de batalla"></canvas>
    <div id="banner" hidden></div>
  </div>
  <div id="shop" class="shop"></div>
  <div class="actions">
    <button id="btnSell" class="btn sell">Vender</button>
    <button id="btnFight" class="btn fight">¡A pelear!</button>
    <button id="btnChars" class="btn">Héroes</button>
    <button id="btnAch" class="btn">Logros</button>
  </div>
</div>
<div id="modal" hidden><div class="mpanel"><div class="mhead"><h2 id="mTitle">Héroes</h2><button class="iconbtn" id="mClose" aria-label="Cerrar">✕</button></div><div class="mbody" id="mBody"></div></div></div>
<div id="toasts"></div>
<div id="boxView" hidden><div id="bvTitle">Toca la caja para abrirla</div><canvas id="bcv" width="600" height="600" aria-label="Caja sorpresa"></canvas><div id="bvName"></div><button class="btn fight" id="bvOk" hidden>¡Genial!</button></div>

<script>
/* ==========================================================
   PERSONAJES (los nombres también se cambian dentro del juego,
   en Héroes → toca un personaje)
   ========================================================== */
const NT=8;
const FAM = {

            tiers:['Bailarina','Cantante','Gamer','Patinadora','Exploradora','Superheroína','Princesa','Reina Arcoíris'],

            hp:1.25,atk:1.3,range:220,speed:45,cd:1.0,kind:'shot',proj:'orb',powers:['hojas','agua','rayo','llama','roca','fantasma','hielo','dragon'],unlock:null},
  aves:    {name:'Aves de Esfera',short:'Aves',style:'bird',boxOnly:true,fly:true,desc:'Aves que vuelan sobre el campo. Los enemigos que pelean de cerca les hacen menos daño.',

            hp:1.4,atk:1.35,range:190,speed:45,cd:1.05,kind:'shot',powers:['rayo','rayo','llama','llama','agua','agua','hojas','hojas'],unlock:null}
};
const BOX_FAMS=['criatura','aves','bestia'],FLYH=26;
const POWER_NAME={rayo:'¡Rayo!',llama:'¡Lanzallamas!',agua:'¡Chorro de agua!',hojas:'¡Hojas navaja!',roca:'¡Lluvia de rocas!',fantasma:'¡Bola sombra!',hielo:'¡Rayo de hielo!',dragon:'¡Pulso dragón!',viento:'¡Tornado!'};
const FAM_KEYS=Object.keys(FAM),SHOP_KEYS=FAM_KEYS.filter(f=>!FAM[f].boxOnly);
const ORBC=['#5fd37a','#4da6ff','#3ee6d0','#ff7a1a','#c9a77a','#a24bdb','#9fe3ff','#ffe14d'];

/* Aspecto de cada rango */
const BLOCK=[
  {weapon:'pick',wcol:'#9da3a8'},

  {armor:'#a9adb3',chain:true,weapon:'sword',wcol:'#d5dade',helm:true},

];
const BRICK={
  ciudad:[
    {torso:'#f08a24',legs:'#2d4f9e',hat:'hardhat',hatCol:'#ffcc00',print:'vest',pc:'#ffe066',acc:'wrench'},
    {torso:'#1f3f8f',legs:'#152b5e',hat:'police',hatCol:'#152b5e',print:'badge',pc:'#ffd23f',acc:'brick'},
    {torso:'#2b2b30',legs:'#2b2b30',hat:'fire',hatCol:'#d7261e',print:'firestripes',pc:'#ffd23f',acc:'axe',face:'grin'},
    {torso:'#f4f4f4',legs:'#1d2a4a',hat:'pilot',hatCol:'#1d2a4a',print:'tie',pc:'#1d2a4a',acc:'brick'},
    {torso:'#f4f4f4',legs:'#5a5a62',hat:'hair',hatCol:'#8a8a8a',print:'coat',pc:'#4aa3df',acc:'flask',face:'glasses'},
    {torso:'#f4f4f4',legs:'#f4f4f4',hat:'astro',hatCol:'#f4f4f4',print:'space',pc:'#2a62d9',acc:'brick',pack:'#cfd3d8'},
    {torso:'#2a62d9',legs:'#2a62d9',hat:'spacehelm',hatCol:'#f4f4f4',visor:'#ffcf3f',print:'space',pc:'#ffd23f',acc:'blaster',pack:'#9aa1a8',face:''},
    {torso:'#1d1d22',legs:'#1d1d22',hat:'spacehelm',hatCol:'#b0262b',visor:'#1d1d22',print:'armor',pc:'#e8384f',acc:'blaster',cape:'#7d1a1e',face:'',aura:'#ff6b3d'}
  ],
  aventura:[
    {torso:'#f4f4f4',legs:'#6b4423',hat:'bandana',hatCol:'#c0392b',print:'stripes',pc:'#c0392b',acc:'cutlass',face:'beard',beard:'#4a2f1b',patch:true},
    {torso:'#8b5a2b',legs:'#5b3a1c',hat:'viking',hatCol:'#a9adb3',print:'belt',pc:'#4a2f1b',acc:'axe',face:'beard',beard:'#d9822b'},

function newState(){return {coins:40,level:1,buys:0,board:[{f:'bloque',t:1,c:2,r:0}],stats:{wins:0,merges:0,maxTier:1,bosses:0,minis:0,perfect:0,losses:0,boxes:0,golds:0},boxes:{comun:1,rara:0,epica:0},ach:{},seen:{bloque1:true},names:{},fnames:{},sound:true};}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.board&&s.stats)return fix(s);}catch(e){}
  try{const o=JSON.parse(localStorage.getItem('fusion-heroes-v1'));if(o&&o.board){const map={ladrillo:'ciudad',estrella:'amigas'};const s=newState();
    s.level=o.level||1;s.coins=o.coins||40;s.buys=o.buys||0;s.board=o.board.map(u=>({f:map[u.f]||u.f,t:u.t,c:u.c,r:u.r}));
    Object.assign(s.stats,o.stats||{});s.seen={};Object.keys(o.seen||{}).forEach(k=>{s.seen[k.replace('ladrillo','ciudad').replace('estrella','amigas')]=true;});
    ['fusion1','gana1','gana3','tier3','ejercito','perfecto','fusion10','tier4','tier5'].forEach(id=>{if(o.ach&&o.ach[id])s.ach[id]=true;});return fix(s);}}catch(e){}
  return null;
}
function fix(s){s.names=s.names||{};s.fnames=s.fnames||{};s.stats.minis=s.stats.minis||0;s.stats.boxes=s.stats.boxes||0;s.stats.golds=s.stats.golds||0;s.stats.eggs=s.stats.eggs||0;s.boxes=s.boxes||{comun:1,rara:0,epica:0};s.boxes.huevo=s.boxes.huevo||0;s.board=s.board.filter(u=>FAM[u.f]);return s;}

/* ---------------- utilidades de dibujo ---------------- */
const _sc={};
function sh(hex,a){const k=hex+a;if(_sc[k])return _sc[k];let r,g,b;if(hex[0]==='#'){const n=parseInt(hex.slice(1),16);r=n>>16;g=n>>8&255;b=n&255;}else{[r,g,b]=hex.match(/\d+/g).map(Number);}
  if(a<0){r*=1+a;g*=1+a;b*=1+a;}else{r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a;}return _sc[k]='rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
function P(c,p,col){c.fillStyle=col;c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();c.fill();}
function C(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}
function E(c,x,y,rx,ry,col,rot=0){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,rot,0,Math.PI*2);c.fill();}
function RR(c,x,y,w,h,r,col){c.fillStyle=col;c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);c.fill();}
function gX(c,x0,x1,col){const g=c.createLinearGradient(x0,0,x1,0);g.addColorStop(0,sh(col,.3));g.addColorStop(.42,col);g.addColorStop(1,sh(col,-.35));return g;}
function gY(c,y0,y1,col){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,sh(col,.25));g.addColorStop(1,sh(col,-.3));return g;}
/* caja 3D: cara frontal + lado + techo */
function B(c,x,y,w,h,col,d=2){const dy=d*.6;P(c,[x,y,x+d,y-dy,x+w+d,y-dy,x+w,y],sh(col,.28));P(c,[x+w,y,x+w+d,y-dy,x+w+d,y+h-dy,x+w,y+h],sh(col,-.32));R(c,x,y,w,h,col);}
function star(c,x,y,r,col){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;p.push(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}P(c,p,col);}
function aura(c,col,y=-17,r=19){const g=c.createRadialGradient(0,y,2,0,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=.45;c.fillStyle=g;c.beginPath();c.arc(0,y,r,0,Math.PI*2);c.fill();c.globalAlpha=1;}
function crown(c,y,s=1){c.save();c.translate(0,y);c.scale(s,s);P(c,[-5,0,5,0,5,-3,3,-1.4,1.6,-4,0,-1.4,-1.6,-4,-3,-1.4,-5,-3],'#ffd23f');R(c,-5,-.6,10,1,'#e0a800');C(c,0,-1.2,.8,'#e63946');C(c,-3,-.6,.5,'#2f80ed');C(c,3,-.6,.5,'#2f80ed');c.restore();}
function handPos(sx,sy,len,ang){return [sx-Math.sin(ang)*len,sy+Math.cos(ang)*len];}

function weapon(c,type,col){
  switch(type){
    case 'sword':R(c,-.55,-1,1.1,3.6,'#5b3a1c');C(c,0,2.8,.75,'#c9a227');R(c,-2.1,-2.1,4.2,1,'#c9a227');P(c,[-.75,-2.1,.75,-2.1,.75,-13,0,-14.4,-.75,-13],col||'#dfe3e8');R(c,-.2,-12.5,.4,10,'rgba(255,255,255,.6)');break;
    case 'firesword':c.globalAlpha=.45;E(c,0,-8,3,7,'#ff6b3d');c.globalAlpha=1;R(c,-.55,-1,1.1,3.6,'#2a1f3a');R(c,-2.3,-2.1,4.6,1.1,'#ff6b3d');P(c,[-.8,-2.1,.8,-2.1,.8,-13.5,0,-15,-.8,-13.5],'#ffb347');R(c,-.25,-13,.5,10,'#fff3a0');break;
    case 'cutlass':R(c,-.55,-1,1.1,3.4,'#5b3a1c');RR(c,-2,-2.3,4,1.2,.5,'#c9a227');c.fillStyle='#dfe3e8';c.beginPath();c.moveTo(-.7,-2.3);c.quadraticCurveTo(2.6,-7,1.2,-12.5);c.lineTo(.4,-11.8);c.quadraticCurveTo(1.2,-7,.7,-2.3);c.closePath();c.fill();break;
    case 'katana':R(c,-.5,-1,1,4.2,'#1d1d22');R(c,-1.3,-1.8,2.6,.8,'#c9a227');c.fillStyle='#eef1f4';c.beginPath();c.moveTo(-.55,-1.8);c.quadraticCurveTo(.4,-9,1.6,-15.5);c.lineTo(1,-15.4);c.quadraticCurveTo(-.3,-9,.55,-1.8);c.closePath();c.fill();break;
    case 'axe':R(c,-.5,-12,1,15,'#7a5230');c.fillStyle=col||'#b9bec4';c.beginPath();c.moveTo(.5,-12);c.quadraticCurveTo(6,-12.5,5.5,-7);c.lineTo(.5,-8.5);c.closePath();c.fill();R(c,-1.6,-12.2,2,3.6,'#7a7f86');break;
    case 'spear':R(c,-.45,-16,.9,21,'#7a5230');P(c,[0,-20,1.4,-16,0,-15,-1.4,-16],'#dfe3e8');R(c,-.9,-15.4,1.8,.8,'#c0392b');break;
    case 'wrench':R(c,-.6,-9,1.2,11,'#8d939b');P(c,[-2,-9,-2,-12,-.8,-12,-.8,-10.4,.8,-10.4,.8,-12,2,-12,2,-9],'#8d939b');break;
    case 'staff':R(c,-.5,-15,1,20,'#7a5230');C(c,0,-15.5,1.3,'#5b3a1c');c.globalAlpha=.6;C(c,0,-16.5,1.6,'#a3f7bf');c.globalAlpha=1;break;
    case 'orbstaff':R(c,-.5,-14,1,19,'#3a2a4a');P(c,[-1.8,-14,1.8,-14,0,-16],'#c9a227');{const g=c.createRadialGradient(-.6,-18.6,.3,0,-18,2.6);g.addColorStop(0,'#ffffff');g.addColorStop(.4,col||'#c77dff');g.addColorStop(1,'rgba(160,80,255,0)');c.fillStyle=g;c.beginPath();c.arc(0,-18,3,0,Math.PI*2);c.fill();}break;
    case 'wand':R(c,-.4,-7,.8,8,'#f4f4f4');star(c,0,-8,2.2,'#fff27a');break;
    case 'bow':c.strokeStyle='#7a5230';c.lineWidth=1;c.beginPath();c.arc(-2,-4,7,-1.1,1.1);c.stroke();c.strokeStyle='#eeeeee';c.lineWidth=.3;c.beginPath();c.moveTo(-2+7*Math.cos(-1.1),-4+7*Math.sin(-1.1));c.lineTo(-2+7*Math.cos(1.1),-4+7*Math.sin(1.1));c.stroke();break;
    case 'blaster':c.rotate(-1.2);R(c,-1,-1.6,6.5,2.4,'#4a4f55');R(c,5.5,-1.2,2.5,1.4,'#2b2f33');R(c,-.6,.4,1.6,2.6,'#2b2f33');R(c,1,-2.2,3,.7,col||'#ff3b3b');break;

  let pts=2+Math.floor(L*1.7);const mt=Math.min(NT,1+Math.floor(L/4));
  const free=()=>{const o=[];for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++)if(!used.has(cc+','+rr))o.push([cc,rr]);return o;};

    const top=Math.min(mt,Math.floor(Math.log2(pts))+1),t=Math.max(1,top-(r()<.4?1:0));
    const [cc,rr]=o[Math.floor(r()*o.length)];used.add(cc+','+rr);
    const k=L<2?wd.enemies[0]:wd.enemies[Math.floor(r()*4)];

function nearestFoe(e,list){let best=null,bd=1e9;list.forEach(o=>{if(o.team!==e.team&&!o.dead){const d=Math.hypot(o.x-e.x,o.y-e.y);if(d<bd){bd=d;best=o;}}});return [best,bd];}
function attack(e,t){
  const dmg=e.atk*(.9+Math.random()*.2),col=e.team==='p'?'#ffe066':'#ff7b7b',k=sizeK(e.t,e.m),kind=e.d.kind;

    if(low){const amt=e.atk*.9;low.hp=Math.min(low.max,low.hp+amt);texts.push({x:low.x,y:low.y-sizeK(low.t,low.m)*36,v:'+'+Math.round(amt),life:.85,col:'#3fd68a'});for(let i=0;i<6;i++)fx.push({x:low.x+(Math.random()*20-10),y:low.y-20-Math.random()*20,vx:0,vy:-30,life:.7,max:1,col:'#7dffb0',s:3,float:true});}}
}
function update(dt){
  time+=dt;shake=Math.max(0,shake-dt);
  fx.forEach(p=>{p.life-=dt;if(!p.ring&&!p.beam){p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.float)p.vy+=260*dt;}});fx=fx.filter(p=>p.life>0);

  S.board.forEach(u=>{if(u.pop)u.pop=Math.max(0,u.pop-dt*3);});
  if(phase!=='battle')return;
  ents.forEach(e=>{if(e.dead)e.deadT+=dt;});
  const alive=ents.filter(e=>!e.dead);
  alive.forEach(e=>{
    e.slow=Math.max(0,e.slow-dt);e.anim+=dt*8;e.atkA=Math.max(0,e.atkA-dt*3.2);e.flash=Math.max(0,e.flash-dt*5);e.timer-=dt;
    const [best,bd]=nearestFoe(e,alive);
    if(!best){e.moving=false;return;}

    const reach=e.range+(best.boss?28:best.mini?12:0)+(e.boss?12:0);

    else{e.moving=false;if(e.timer<=0){e.timer=e.cd*(.9+Math.random()*.2);attack(e,best);}}
  });
  for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++){const a=alive[i],b=alive[j];if(a.fly!==b.fly)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,min=(a.team===b.team?32:24)*Math.max(1,(a.m+b.m)/2);if(d<min){const push=(min-d)/2,ux=dx/d,uy=dy/d;a.x-=ux*push;a.y-=uy*push;b.x+=ux*push;b.y+=uy*push;}}
  alive.forEach(e=>{e.x=Math.max(20,Math.min(W-20,e.x));e.y=Math.max(70,Math.min(H-6,e.y));});
  projs.forEach(p=>{
    if(!p.t.dead){p.tx=p.t.x;p.ty=p.t.y-20-(p.t.fly?FLYH:0);}
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),sp=(p.pk==='arrow'?560:440)*dt;p.spin+=dt*12;

      else{hit(p.t,p.dmg,p.col,null);if(p.push&&!p.t.dead&&!p.t.boss)p.t.y+=p.t.team==='e'?-p.push:p.push;burst(p.tx,p.ty,p.pk==='fire'?'#ff9a3d':'#ffffff',5,60);}

  });projs=projs.filter(p=>!p.done);

}
function finish(win){

  }
  save();

}

/* ---------------- cajas sorpresa ---------------- */
const BOXES={
  comun:{q:1,name:'Caja Común',col:'#3a8fd6',rib:'#ffe14d',tiers:[[1,.7],[2,.3]],mon:.15,mult:1,desc:'Trae un héroe de rango 1 o 2'},
  rara:{q:2,name:'Caja Rara',col:'#8a4fd6',rib:'#5ef0ff',tiers:[[2,.6],[3,.4]],mon:.3,mult:3,desc:'Trae un héroe de rango 2 o 3'},
  epica:{q:3,name:'Caja Épica',col:'#f2a20c',rib:'#ff4f8b',tiers:[[3,.5],[4,.35],[5,.15]],mon:.5,mult:8,desc:'Trae un héroe de rango 3 a 5'},
  huevo:{q:4,name:'Huevo Sorpresa',egg:true,col:'#e8384f',rib:'#ffffff',tiers:[[4,.5],[5,.35],[6,.15]],mon:1,mult:20,desc:'Siempre trae una criatura, ave o bestia de rango 4 a 6. ¡El premio más caro!'}
};
const boxPrice=k=>Math.round((30+3*S.level)*BOXES[k].mult);
function rollBox(k){const b=BOXES[k];let r=Math.random(),t=b.tiers[0][0];for(const [tt,p] of b.tiers){if(r<p){t=tt;break;}r-=p;}
  t=Math.min(t,maxTier(S.level)+(b.egg?1:0));const pool=SHOP_KEYS.filter(famUnlocked);
  const f=Math.random()<b.mon?BOX_FAMS[Math.floor(Math.random()*BOX_FAMS.length)]:pool[Math.floor(Math.random()*pool.length)];return {f,t};}
let box=null;
function openBox(k,free){
  if(phase!=='prep'){toast('Abre las cajas antes de pelear','warn');return;}
  if(free){if(!(S.boxes[k]>0))return;}else if(S.coins<boxPrice(k)){sfx.no();toast('Te faltan monedas para la '+BOXES[k].name,'warn');return;}
  const e=emptyCell();if(!e){sfx.no();toast('Tu campo está lleno. Fusiona o vende un héroe para abrir una caja.','warn');return;}
  if(free)S.boxes[k]--;else S.coins-=boxPrice(k);
  const {f,t}=rollBox(k),isNew=!S.seen[f+t];
  S.seen[f+t]=true;S.stats.boxes++;if(BOXES[k].egg)S.stats.eggs++;S.stats.maxTier=Math.max(S.stats.maxTier,t);
  S.board.push({f,t,c:e.c,r:e.r,pop:1,q:BOXES[k].q});save();
  closeModal();box={k,f,t,q:BOXES[k].q,isNew,T:0,opened:false,conf:[]};
  $('bvTitle').textContent=BOXES[k].egg?'Toca el huevo para abrirlo':'Toca la caja para abrirla';$('bvName').innerHTML='';$('bvOk').hidden=true;$('boxView').hidden=false;
  $('shop').querySelectorAll('.buy').forEach(b=>{if(b.id!=='buy-box')b.dataset.un='';});
  tone(330,.2,'triangle',.05);hud();
}
const bctx=$('bcv').getContext('2d');
$('bcv').addEventListener('click',()=>{audio();if(box&&!box.opened)box.T=Math.max(box.T,1.6);});
$('bvOk').addEventListener('click',()=>{$('boxView').hidden=true;box=null;hud();checkAch();});
function renderBox(dt){
  const b=box,c=bctx,BX=BOXES[b.k];b.T+=dt;
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,600,600);
  if(!b.opened&&b.T>=1.6){b.opened=true;b.OT=0;sfx.merge();
    for(let i=0;i<70;i++){const an=Math.random()*Math.PI*2,v=150+Math.random()*380;b.conf.push({x:300,y:360,vx:Math.cos(an)*v,vy:Math.sin(an)*v-220,col:['#ffe14d','#ff4f8b','#5ec8ff','#3fd68a',BX.col][i%5],s:5+Math.random()*7,rot:Math.random()*6});}}
  if(!b.opened){
    const amp=Math.min(1,b.T/1.6),sk=Math.sin(b.T*38)*amp*.12;
    const g=c.createRadialGradient(300,400,10,300,400,260);g.addColorStop(0,BX.col);g.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=.35+amp*.3;c.fillStyle=g;c.fillRect(0,0,600,600);c.globalAlpha=1;
    c.save();c.translate(300,500);c.rotate(sk);c.scale(11,11);if(BX.egg)drawEgg(c,BX,amp>.4?(amp-.4)/.6:0,0);else drawGift(c,BX.col,BX.rib,amp>.7?(amp-.7)*4*Math.abs(Math.sin(b.T*22)):0);c.restore();
    for(let i=0;i<8;i++){const an=time*1.5+i*Math.PI/4;c.globalAlpha=amp;star(c,300+Math.cos(an)*200,360+Math.sin(an)*170,8+4*Math.sin(time*6+i),'#ffe14d');}c.globalAlpha=1;
  }else{
    b.OT+=dt;const o=b.OT;
    c.save();c.translate(300,330);c.rotate(time*.6);for(let i=0;i<14;i++){c.rotate(Math.PI*2/14);c.globalAlpha=.3;P(c,[0,0,-45,-440,45,-440],i%2?BX.rib:BX.col);}c.restore();c.globalAlpha=1;
    const g=c.createRadialGradient(300,330,10,300,330,220);g.addColorStop(0,'rgba(255,255,255,.7)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,600,600);
    c.save();c.translate(300,560);c.scale(8,8);c.globalAlpha=Math.max(0,1-o*1.6);if(BX.egg)drawEgg(c,BX,1,o*45);else drawGift(c,BX.col,BX.rib,o*45);c.restore();c.globalAlpha=1;
    const s=o<.4?(o/.4)*1.12:1+.12*Math.max(0,1-(o-.4)/.3);
    c.save();c.translate(300,500);c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(0,0,70*s,16*s,0,0,Math.PI*2);c.fill();const k=6.6*s;c.scale(k,k);drawChar(c,b.f,b.t,time*2,0);c.restore();
    b.conf.forEach(p=>{p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*8;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore();});
    c.globalAlpha=Math.max(0,1-o*2.5);c.fillStyle='#ffffff';c.fillRect(0,0,600,600);c.globalAlpha=1;
    if(o>.35&&$('bvOk').hidden){
      $('bvTitle').innerHTML=esc(BX.name)+' · <span style="color:'+TIERC[b.t-1]+'">Rango '+b.t+'</span>';
      $('bvName').innerHTML=esc(nameOf(b.f,b.t))+(b.isNew?'<span class="newtag">¡NUEVO!</span>':'')+'<div style="font-size:15px;color:var(--muted);font-family:var(--f-body);font-weight:800">'+esc(famName(b.f))+'</div><div style="font-size:17px;color:#ffd23f;font-family:var(--f-body);font-weight:900">'+'★'.repeat(b.q)+' +'+qPct(b.q)+'% de poder</div>';
      $('bvOk').hidden=false;$('bvOk').focus();if(b.isNew)sfx.ach();
    }
  }
}

function focusEditor(){const i=$('nmInput');if(i){i.focus();i.select();i.scrollIntoView({block:'center'});}}
function closeModal(){$('modal').hidden=true;editing=null;}
$('mClose').addEventListener('click',closeModal);
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('btnChars').addEventListener('click',()=>{editing=null;openModal('chars');});
$('btnAch').addEventListener('click',()=>openModal('ach'));
$('btnWorld').addEventListener('click',()=>openModal('worlds'));
$('btnFight').addEventListener('click',()=>{audio();startBattle();});
$('btnSell').addEventListener('click',()=>{sellMode=!sellMode;$('btnSell').classList.toggle('on',sellMode);$('btnSell').textContent=sellMode?'Listo':'Vender';if(sellMode)toast('Toca un héroe para venderlo','info',1600);});
$('btnSound').addEventListener('click',()=>{S.sound=!S.sound;audio();save();hud();});

fit();hud();requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderShop();});
</script>
